# showip backend config for librespeed-go.
# Bind all interfaces (both IPv4 and IPv6) on port 80.
bind_address=""
listen_port=80
proxyprotocol_port=0
# Non-zero so the backend uses these coordinates directly instead of phoning
# ipinfo.io at startup to geolocate itself. The values are cosmetic only — our
# single-server UI never displays server location/distance.
server_lat=1
server_lng=1
ipinfo_api_key=""

# Serve our custom frontend instead of the embedded default UI.
assets_path="/app/assets"

# No telemetry/stats: keeps the container fully self-contained, no DB, no result PNGs.
statistics_password="disabled"
redact_ip_addresses=false
database_type="none"

enable_tls=false
enable_http2=false
